name: Bug
description: Something in the CLI, MCP server, or API is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: shell
      placeholder: npx openagentskills search "..."
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: "`npm ls openagentskills` or the version you ran with npx"
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "node -v"
